name: Generate snake animation

on:
  # roda todo dia à meia-noite (UTC)
  schedule:
    - cron: "0 0 * * *"

  # permite rodar manualmente
  workflow_dispatch:

  # roda a cada push na main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      # gera a cobra a partir do grafico de contribuicoes do dono do repo
      # (tema escuro com a paleta do tokyonight, tema claro com a paleta padrao do GitHub)
      - name: Generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?color_snake=#bb9af7&color_dots=#1a1b27,#24325f,#3d59a1,#5d7fd6,#7aa2f7

      # publica o conteudo de dist na branch "output"
      # https://raw.githubusercontent.com/HugoJunioor/HugoJunioor/output/<arquivo>
      - name: Push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
